# The fabric, as we mean it to be. The switches' startup configs come from this file (lab/render.py), and in
# chapter 2 so does the graph: twin/load_intent.py loads it into Neo4j as the twin's intended side.
#
#        spine1 (AS 65000)        spine2 (AS 65000)
#        Eth1 Eth2 Eth3 Eth4      Eth1 Eth2 Eth3 Eth4
#         |    |    |    |         |    |    |    |
#       leaf1 leaf2 leaf3 leaf4  (each leaf: Eth1 to spine1, Eth2 to spine2, Eth3 to its host)
#       65001 65002 65003 65004
#         |     |     |     |
#       host1 host3 host4 host2
fabric:
  name: dc1
  site: dc1
  spine_asn: 65000
  mtu: 1500

devices:
  spine1: {role: spine, mgmt: 172.80.91.11, loopback: 10.255.0.11}
  spine2: {role: spine, mgmt: 172.80.91.12, loopback: 10.255.0.12}
  leaf1: {role: leaf, asn: 65001, mgmt: 172.80.91.21, loopback: 10.255.0.21,
          hosts: [{port: Ethernet3, subnet: 10.10.1.0/24, gateway: 10.10.1.1, host: host1, address: 10.10.1.10}]}
  leaf2: {role: leaf, asn: 65002, mgmt: 172.80.91.22, loopback: 10.255.0.22,
          hosts: [{port: Ethernet3, subnet: 10.10.2.0/24, gateway: 10.10.2.1, host: host3, address: 10.10.2.10}]}
  leaf3: {role: leaf, asn: 65003, mgmt: 172.80.91.23, loopback: 10.255.0.23,
          hosts: [{port: Ethernet3, subnet: 10.10.3.0/24, gateway: 10.10.3.1, host: host4, address: 10.10.3.10}]}
  leaf4: {role: leaf, asn: 65004, mgmt: 172.80.91.24, loopback: 10.255.0.24,
          hosts: [{port: Ethernet3, subnet: 10.10.4.0/24, gateway: 10.10.4.1, host: host2, address: 10.10.4.10}]}

# Point-to-point links. The first end gets the even address of the /31, the second end the odd one.
links:
  - {a: spine1:Ethernet1, b: leaf1:Ethernet1, subnet: 10.0.11.0/31}
  - {a: spine1:Ethernet2, b: leaf2:Ethernet1, subnet: 10.0.12.0/31}
  - {a: spine1:Ethernet3, b: leaf3:Ethernet1, subnet: 10.0.13.0/31}
  - {a: spine1:Ethernet4, b: leaf4:Ethernet1, subnet: 10.0.14.0/31}
  - {a: spine2:Ethernet1, b: leaf1:Ethernet2, subnet: 10.0.21.0/31}
  - {a: spine2:Ethernet2, b: leaf2:Ethernet2, subnet: 10.0.22.0/31}
  - {a: spine2:Ethernet3, b: leaf3:Ethernet2, subnet: 10.0.23.0/31}
  - {a: spine2:Ethernet4, b: leaf4:Ethernet2, subnet: 10.0.24.0/31}
